name: CI

on:
  push:
    tags-ignore:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per task.json execution handler (Node24, Node20_1)
        node-version: [20.x, 24.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint, build and test
        run: npm test -- --ci
        env:
          CI: true

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install tools
        run: npm install -g tfx-cli@0.21.1 --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Package vsix
        run: npm run pack

      - name: Verify vsix content
        run: node scripts/verify-vsix.js vsts-changed-files-multibranch.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vsts-changed-files-multibranch.vsix
