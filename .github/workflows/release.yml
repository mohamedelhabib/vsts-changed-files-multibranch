name: Release & publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::Git tag (${GITHUB_REF_NAME}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install tools
        run: npm install -g tfx-cli@0.21.1 --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Package vsix file
        run: npm run pack

      - name: Verify vsix content
        run: node scripts/verify-vsix.js vsts-changed-files-multibranch.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: release-vsix
          path: |
            vsts-changed-files-multibranch.vsix
            vss-extension.json
          retention-days: 5

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install tfx-cli
        run: npm install -g tfx-cli@0.21.1 --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: release-vsix

      - name: Exchange OIDC token for Marketplace token
        id: marketplace-auth
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo "Requesting GitHub OIDC token..."
          OIDC_JWT=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=marketplace.visualstudio.com" | jq -r '.value // empty')

          if [[ -z "${OIDC_JWT}" ]]; then
            echo "::error::Failed to retrieve GitHub Actions ID token"
            exit 1
          fi
          echo "::add-mask::${OIDC_JWT}"

          echo "Exchanging token with Visual Studio Marketplace..."
          RESP_FILE="$(mktemp)"
          trap 'rm -f "${RESP_FILE}"' EXIT
          HTTP_CODE=$(printf 'Authorization: FederatedToken %s\n' "${OIDC_JWT}" | curl -sS -o "${RESP_FILE}" -w '%{http_code}' \
            -X POST "https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1" \
            -H @- \
            -H "Content-Type: application/json" \
            -d '{"publisherName": "MohamedElhabib"}')

          if [[ "${HTTP_CODE}" != 2* ]]; then
            ERR_MSG=$(jq -r '.message // "non-2xx response"' "${RESP_FILE}" 2>/dev/null || echo "non-JSON error")
            echo "::error::Marketplace token exchange failed (HTTP ${HTTP_CODE}): ${ERR_MSG}"
            exit 1
          fi

          TOKEN=$(jq -r '.credential // .token // .accessToken // .access_token // empty' "${RESP_FILE}")
          if [[ -z "${TOKEN}" ]]; then
            echo "::error::Marketplace token response did not contain a token field (HTTP ${HTTP_CODE})"
            exit 1
          fi

          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
          echo "Marketplace token successfully acquired."

      - name: Publish extension
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ steps.marketplace-auth.outputs.token || secrets.VSS_PAT }}
        run: |
          tfx extension publish --manifest-globs vss-extension.json --vsix vsts-changed-files-multibranch.vsix --token "${PUBLISH_TOKEN}"
