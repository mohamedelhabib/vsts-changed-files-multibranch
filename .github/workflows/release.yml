name: Release & publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install tools
        run: npm install -g tfx-cli

      - name: Install dependencies
        run: npm ci

      - name: Package vsix file
        run: npm run pack

      - name: Verify vsix content
        run: node scripts/verify-vsix.js vsts-changed-files-multibranch.vsix

      - name: Exchange OIDC token for Marketplace token
        id: marketplace-auth
        shell: bash
        run: |
          set -e
          echo "Requesting GitHub OIDC token..."
          OIDC_JWT=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=marketplace.visualstudio.com" | jq -r '.value')

          if [ -z "${OIDC_JWT}" ] || [ "${OIDC_JWT}" = "null" ]; then
            echo "::error::Failed to retrieve GitHub Actions ID token"
            exit 1
          fi

          echo "Exchanging token with Visual Studio Marketplace..."
          RESPONSE=$(curl -sS -X POST "https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1" \
            -H "Authorization: FederatedToken ${OIDC_JWT}" \
            -H "Content-Type: application/json" \
            -d '{"publisherName": "MohamedElhabib"}')

          TOKEN=$(echo "${RESPONSE}" | jq -r '.token // .accessToken // .access_token // empty')
          if [ -z "${TOKEN}" ]; then
            echo "::error::Marketplace token exchange failed: ${RESPONSE}"
            exit 1
          fi

          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
          echo "Marketplace token successfully acquired."

      - name: Publish extension
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ steps.marketplace-auth.outputs.token || secrets.VSS_PAT }}
        run: |
          tfx extension publish --manifest-globs vss-extension.json --vsix vsts-changed-files-multibranch.vsix --token "${PUBLISH_TOKEN}"
