name: Release & publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install tools
        run: npm install -g tfx-cli

      - name: Install dependencies
        run: npm ci

      - name: Package vsix file
        run: npm run pack

      - name: Verify vsix content
        run: node scripts/verify-vsix.js vsts-changed-files-multibranch.vsix

      - name: Publish extension
        shell: bash
        env:
          VSS_PAT: ${{ secrets.VSS_PAT }}
        run: |
          tfx extension publish --manifest-globs vss-extension.json --vsix vsts-changed-files-multibranch.vsix --token "${VSS_PAT}"
